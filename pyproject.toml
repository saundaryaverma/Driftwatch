[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Regression testing for LLM apps: catch the answers that quietly got worse."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[tool.setuptools]
packages = ["driftwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["driftwatch"]
omit = ["driftwatch/__main__.py"]
